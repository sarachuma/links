<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Чатика</title>
    
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geologica:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        
        @font-face {
            font-family: 'BOU COLLEGIATE RUS';
            src: url('fonts/Bou_Collegiate.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Geologica Local';
            src: url('fonts/Geologica.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        :root {
            
            --bg-deep: #030624;         
            --bg-velvet: #0C1E5B;       
            --bg-sunset: #002daa;       
            
            
            --accent-light: #ff4d4d;      
            --accent-main: #fe0000;       
            --accent-dark: #741511;       
            
            --warm-star: #fce8a1;       
            --cute-pink: #ff8fa3;       
            
            --text-main: #f0edf5;       
            --text-muted: #8b9dc3;      
            
            
            --font-title: 'Geologica Local', 'Geologica', sans-serif;
            --font-text: 'Geologica Local', 'Geologica', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.8;
        }

        body {
            background-color: var(--bg-deep);
            background-image: url('background6.webp'); 
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        
        .social-panel {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 10px;
            margin-bottom: 25px;
            position: relative;
            z-index: 10;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            background: rgba(3, 6, 36, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff; 
            text-decoration: none;
            border-radius: 2px;
            border: 2px solid var(--accent-main);
            transition: all 0.2s ease; 
            animation: fadeInDown 0.4s ease forwards;
            opacity: 0;
            box-shadow: 4px 4px 0px var(--accent-dark), 0 10px 25px rgba(0,0,0,0.8);
        }

        
        .social-btn.boosty-btn {
            width: auto;
            padding: 0 22px;
        }

        .social-btn:nth-child(1) { animation-delay: 0.0s; }
        .social-btn:nth-child(2) { animation-delay: 0.1s; }
        .social-btn:nth-child(3) { animation-delay: 0.2s; }

        .social-btn svg {
            width: 28px;
            height: 28px;
            filter: drop-shadow(2px 2px 0px var(--accent-dark)) drop-shadow(0 0 10px rgba(254, 0, 0, 0.8));
            transition: all 0.2s ease;
        }

        
        .boosty-text {
            font-family: 'Arial Black', var(--font-title);
            font-weight: 900;
            font-style: italic;
            font-size: 26px;
            letter-spacing: -1px;
            text-shadow: 2px 2px 0px var(--accent-dark), 0 0 10px rgba(254, 0, 0, 0.8);
            transition: all 0.2s ease;
            line-height: 1;
            padding-right: 2px;
        }

        .social-btn:hover {
            background: var(--accent-main);
            color: #ffffff;
            border-color: var(--accent-main);
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--accent-dark), 0 0 20px rgba(254, 0, 0, 0.6);
        }
        
        .social-btn:hover svg {
            filter: none; 
            transform: scale(1.1); 
        }

        .social-btn:hover .boosty-text {
            text-shadow: none; 
            transform: scale(1.08); 
        }
        
        .social-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--accent-dark), 0 0 10px rgba(254, 0, 0, 0.6);
        }

        
        .portal-header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.4s ease forwards;
            background: rgba(3, 6, 36, 0.75);
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            padding: 30px 60px;
            border-radius: 2px;
            border: 1px solid rgba(254, 0, 0, 0.2);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(254, 0, 0, 0.15);
        }

        .portal-header h1 {
            font-family: var(--font-title);
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: -3px 0 var(--bg-sunset), 3px 0 var(--accent-main), 0 0 20px rgba(254, 0, 0, 0.5);
            margin-bottom: 15px;
        }

        .portal-header h1::before, .portal-header h1::after {
            content: '♦';
            display: inline-block;
            font-size: 34px;
            vertical-align: middle;
            color: var(--accent-main);
            margin: 0 15px;
            filter: drop-shadow(0 0 10px rgba(254, 0, 0, 0.6));
        }

        .portal-header p {
            font-size: 20px;
            color: #ffffff;
            font-weight: 700;
            opacity: 1;
            letter-spacing: 1px;
            font-family: var(--font-title);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); 
        }

        .cards-wrapper {
            display: flex;
            gap: 50px;
            justify-content: center;
            align-items: stretch; 
            flex-wrap: wrap;
            max-width: 1200px;
            width: 100%;
            margin-bottom: 30px; 
        }

        .portal-card {
            display: flex; 
            flex-direction: column; 
            text-decoration: none;
            width: 420px;
            background: rgba(12, 30, 91, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--accent-dark);
            border-radius: 2px;
            padding: 10px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(254, 0, 0, 0.1);
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .portal-card:nth-child(1) { animation-delay: 0.1s; }
        .portal-card:nth-child(2) { animation-delay: 0.2s; }

        .portal-card::before {
            content: ''; position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px dashed rgba(254, 0, 0, 0.3);
            border-radius: 2px; 
            pointer-events: none; z-index: 10;
            transition: all 0.4s ease;
        }

        .portal-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--accent-main);
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 40px rgba(254, 0, 0, 0.3);
        }

        .portal-card:hover::before {
            border-color: rgba(254, 0, 0, 0.8);
        }

        .card-img-wrapper {
            width: 100%;
            height: 280px;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            background: var(--bg-deep);
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            border: 2px solid rgba(254, 0, 0, 0.2);
            flex-shrink: 0; 
        }

        .fallback-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            z-index: 1;
            filter: drop-shadow(0 0 15px rgba(254, 0, 0, 0.5));
        }

        .card-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 2;
            transition: transform 0.7s ease, opacity 0.3s ease;
        }

        .portal-card:hover .card-img {
            transform: scale(1.08);
        }

        .card-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 6, 36, 0.2);
            z-index: 3;
            transition: background 0.4s ease;
            pointer-events: none;
        }

        .portal-card:hover .card-overlay {
            background: rgba(254, 0, 0, 0.05);
        }

        .card-info {
            padding: 30px 20px 20px;
            text-align: center;
            position: relative;
            z-index: 4;
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }

        .card-title {
            font-family: var(--font-title);
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px var(--accent-dark), 0 0 10px rgba(254, 0, 0, 0.8);
            transition: color 0.3s ease, text-shadow 0.3s ease;
            letter-spacing: 1px;
        }

        .portal-card:hover .card-title {
            color: #ffffff;
            text-shadow: 2px 2px 0px var(--accent-dark), 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .card-desc {
            font-family: var(--font-text);
            font-size: 16px;
            color: #dbe4f9;
            line-height: 1.5;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .portal-card:hover .card-desc {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }

        .help-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(3, 6, 36, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff; 
            text-decoration: none;
            padding: 12px 35px;
            border-radius: 2px; 
            border: 2px solid var(--accent-main);
            font-family: var(--font-title);
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px; 
            transition: all 0.2s ease; 
            animation: fadeInUp 0.4s ease 0.3s forwards;
            opacity: 0;
            
            box-shadow: 4px 4px 0px var(--accent-dark), 0 10px 25px rgba(0,0,0,0.8);
            text-shadow: 2px 2px 0px var(--accent-dark), 0 0 10px rgba(254, 0, 0, 0.8);
        }

        .help-btn svg {
            filter: drop-shadow(2px 2px 0px var(--accent-dark)) drop-shadow(0 0 10px rgba(254, 0, 0, 0.8));
            transition: all 0.2s ease;
        }

        .help-btn:hover {
            background: var(--accent-main);
            color: #ffffff;
            border-color: var(--accent-main);
            text-shadow: none; 
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--accent-dark), 0 0 20px rgba(254, 0, 0, 0.6);
        }
        
        .help-btn:hover svg {
            filter: none; 
        }
        
        .help-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--accent-dark), 0 0 10px rgba(254, 0, 0, 0.6);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .portal-header { padding: 20px 30px; } 
            .portal-header h1 { font-size: 38px; }
            .portal-card { width: 100%; max-width: 420px; }
            .cards-wrapper { flex-direction: column; gap: 30px; }
        }
    </style>
</head>
<body>
